name: Resolve Release

# Validates the release tag and extracts a version string for downstream
# jobs. Enforces two invariants:
#   1. Tag matches the strict semver shape: vX.Y.Z (digits only)
#   2. The tagged commit exists on the base branch
#
# The previous version of this workflow accepted a `-hotfix` suffix that
# skipped the base-branch check. That path has been removed: hotfix
# releases now run through their own dedicated workflow which builds
# from an arbitrary target branch.

on:
  workflow_call:
    inputs:
      base-branch:
        description: "Branch the tagged commit must belong to"
        required: false
        type: string
        default: main

    outputs:
      version:
        description: "Release version (without leading v)"
        value: ${{ jobs.resolve.outputs.version }}

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"

          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid tag format: $TAG"
            echo "::error::Expected vX.Y.Z (digits only). Hotfix releases use the hotfix workflow."
            exit 1
          fi

          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Confirm tagged commit is on base branch
        shell: bash
        run: |
          set -euo pipefail

          BRANCH="${{ inputs.base-branch }}"
          COMMIT=$(git rev-list -n 1 "$GITHUB_REF_NAME")

          git fetch origin "$BRANCH" --depth=1

          if ! git branch --remotes --contains "$COMMIT" | grep -q "origin/$BRANCH"; then
            echo "::error::Tag commit $COMMIT is not on $BRANCH."
            echo "::error::Releases must be tagged from $BRANCH. If this is an out-of-band fix,"
            echo "::error::use the hotfix workflow instead."
            exit 1
          fi
