name: Resolve Release

on:
  workflow_call:
    inputs:
      base-branch:
        description: "Branch the tagged commit must belong to"
        required: false
        type: string
        default: main

    outputs:
      version:
        description: "Release version (without leading v)"
        value: ${{ jobs.resolve.outputs.version }}

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}
      skip-base-check: ${{ steps.version.outputs.skip-base-check }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract version from tag
        id: version
        shell: bash
        run: |
          set -euo pipefail

          TAG="${GITHUB_REF_NAME}"

          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            VERSION="${TAG#v}"
            SKIP="false"
          elif [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-hotfix$ ]]; then
            VERSION="${TAG#v}"
            SKIP="true"
            echo "⚠️  Hotfix release: skipping base branch check"
          else
            echo "❌ Invalid tag format: $TAG"
            echo "   Expected vX.Y.Z or vX.Y.Z-hotfix"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "skip-base-check=$SKIP" >> "$GITHUB_OUTPUT"

      - name: Confirm tagged commit is on base branch
        if: steps.version.outputs.skip-base-check != 'true'
        shell: bash
        run: |
          set -euo pipefail

          BRANCH="${{ inputs.base-branch }}"
          COMMIT=$(git rev-list -n 1 "$GITHUB_REF_NAME")

          git fetch origin "$BRANCH" --depth=1

          if ! git branch --remotes --contains "$COMMIT" | grep -q "origin/$BRANCH"; then
            echo "❌ Tag commit is not on $BRANCH"
            exit 1
          fi
